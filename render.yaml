services:
  # ── Backend: FastAPI + YOLOv8 ──────────────────────────────────────────────
  - type: web
    name: roadguard-api
    runtime: python
    region: oregon
    plan: free
    rootDir: roadguard/backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        value: https://roadguard-ui.onrender.com
      - key: DATABASE_URL
        value: /data/detections.db

  # ── Frontend: Vite/React Static Site ──────────────────────────────────────
  - type: static
    name: roadguard-ui
    rootDir: roadguard/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://roadguard-api.onrender.com/api
